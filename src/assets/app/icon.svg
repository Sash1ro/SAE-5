<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e5f5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background (full bleed, Android applies the mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="-40"/>
    <line x1="512" y1="512" x2="1064" y2="-40"/>
    <line x1="512" y1="512" x2="1064" y2="512"/>
    <line x1="512" y1="512" x2="1064" y2="1064"/>
    <line x1="512" y1="512" x2="512" y2="1064"/>
    <line x1="512" y1="512" x2="-40" y2="1064"/>
    <line x1="512" y1="512" x2="-40" y2="512"/>
    <line x1="512" y1="512" x2="-40" y2="-40"/>
  </g>

  <!-- Manga volume -->
  <g filter="url(#shadow)">
    <rect x="352" y="272" width="320" height="480" rx="26" fill="url(#cover)"/>
    <path d="M352 298a26 26 0 0 1 26-26h22v480h-22a26 26 0 0 1-26-26z" fill="#1a1033"/>
  </g>

  <!-- Cover panels -->
  <rect x="428" y="312" width="208" height="170" rx="10" fill="#4c1d95"/>
  <path d="M428 482 L560 312 L636 312 L636 482 Z" fill="#e11d48" opacity="0.9"/>
  <rect x="428" y="506" width="100" height="206" rx="10" fill="#1a1033"/>
  <rect x="544" y="506" width="92" height="96" rx="10" fill="#1a1033"/>
  <rect x="544" y="616" width="92" height="96" rx="10" fill="#4c1d95"/>

  <!-- Spark on first panel -->
  <path d="M532 352 l12 38 38 12 -38 12 -12 38 -12 -38 -38 -12 38 -12 z" fill="#ffffff"/>

  <!-- Scan line -->
  <rect x="270" y="500" width="484" height="14" rx="7" fill="url(#scan)" filter="url(#glow)"/>
  <rect x="270" y="503" width="484" height="8" rx="4" fill="url(#scan)"/>

  <!-- Viewfinder brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 372 V282 a20 20 0 0 1 20-20 H372"/>
    <path d="M652 262 H742 a20 20 0 0 1 20 20 V372"/>
    <path d="M762 652 V742 a20 20 0 0 1-20 20 H652"/>
    <path d="M372 762 H282 a20 20 0 0 1-20-20 V652"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
