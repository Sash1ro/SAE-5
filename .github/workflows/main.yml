name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version personnalisée (ex: 1.2.0) — laisser vide pour lire app.json'
        required: false
        type: string
      prerelease:
        description: 'Marquer comme pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      apk_name: ${{ steps.rename.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/ci-mirrors.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"

          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  gradlePluginPortal()
                  google()
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri(mirrorUrl)
                  }
                  mavenCentral()
              }
          }

          gradle.beforeProject { proj ->
              proj.buildscript.repositories {
                  gradlePluginPortal()
                  google()
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri(mirrorUrl)
                  }
                  mavenCentral()
              }
          }

          gradle.afterProject { proj ->
              if (!proj.repositories.isEmpty()) {
                  try {
                      def mirror = proj.repositories.maven {
                          name = "GoogleMavenCentralMirror"
                          url = uri(mirrorUrl)
                      }
                      proj.repositories.remove(mirror)
                      proj.repositories.add(0, mirror)
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Patch Gradle 9 compatibility in node_modules
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // 1. Replace removed org.gradle.util.VersionNumber in onnxruntime-react-native
          const ortFile = 'node_modules/onnxruntime-react-native/android/build.gradle';
          if (fs.existsSync(ortFile)) {
            let content = fs.readFileSync(ortFile, 'utf8');
            if (content.includes('org.gradle.util.VersionNumber')) {
              content = content.replace(/org\.gradle\.util\.VersionNumber/g, 'CiVersionNumber');
              content += `
          class CiVersionNumber implements Comparable<CiVersionNumber> {
            int major = 0
            int minor = 0
            int micro = 0

            static CiVersionNumber parse(Object v) {
              def vn = new CiVersionNumber()
              if (v == null) return vn
              def parts = v.toString().replaceAll('[^0-9.].*$', '').tokenize('.')
              if (parts.size() > 0 && parts[0]) vn.major = parts[0] as int
              if (parts.size() > 1 && parts[1]) vn.minor = parts[1] as int
              if (parts.size() > 2 && parts[2]) vn.micro = parts[2] as int
              return vn
            }

            int compareTo(CiVersionNumber o) {
              int c = this.major <=> o.major
              if (c != 0) return c
              c = this.minor <=> o.minor
              if (c != 0) return c
              return this.micro <=> o.micro
            }
          }
          `;
              fs.writeFileSync(ortFile, content);
              console.log('Patched VersionNumber in:', ortFile);
            }
          }

          // 2. Guard components["release"] / components.release in expo & expo-modules-core
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'build' || entry.name === '.git') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else if (/\.(kt|kts)$/.test(entry.name)) {
                const content = fs.readFileSync(full, 'utf8');
                let updated = content.replace(
                  /from\(\s*((?:[A-Za-z_]\w*\.)?components)\s*\[\s*"release"\s*\]\s*\)/g,
                  '$1.findByName("release")?.let { from(it) }'
                );
                updated = updated.replace(
                  /from\(\s*((?:[A-Za-z_]\w*\.)?components)\.getByName\(\s*"release"\s*\)\s*\)/g,
                  '$1.findByName("release")?.let { from(it) }'
                );
                if (updated !== content) {
                  fs.writeFileSync(full, updated);
                  console.log('Patched Kotlin release component in:', full);
                }
              } else if (/\.(gradle|groovy)$/.test(entry.name)) {
                const content = fs.readFileSync(full, 'utf8');
                let updated = content.replace(
                  /from\s*\(?\s*((?:[A-Za-z_]\w*\.)?components)\.release\s*\)?/g,
                  "if ($1.findByName('release') != null) { from($1.release) }"
                );
                updated = updated.replace(
                  /from\s*\(?\s*((?:[A-Za-z_]\w*\.)?components)\s*\[\s*['"]release['"]\s*\]\s*\)?/g,
                  "if ($1.findByName('release') != null) { from($1['release']) }"
                );
                if (updated !== content) {
                  fs.writeFileSync(full, updated);
                  console.log('Patched Groovy release component in:', full);
                }
              }
            }
          }

          walk('node_modules/expo');
          walk('node_modules/expo-modules-core');
          EOF

      - name: Extract app name & version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CONFIG_JSON=$(npx expo config --type public --json)

          APP_NAME=$(echo "$CONFIG_JSON" | node -e "
            const c = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const raw = c.slug || c.name || 'app';
            console.log(raw.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, ''));
          ")

          CONFIG_VERSION=$(echo "$CONFIG_JSON" | node -e "
            const c = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(c.version || '1.0.0');
          ")

          TRIMMED_INPUT=$(echo "$INPUT_VERSION" | xargs)
          CLEAN_INPUT="${TRIMMED_INPUT#v}"
          VERSION="${CLEAN_INPUT:-$CONFIG_VERSION}"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: rename
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Erreur : aucun APK trouvé dans $APK_DIR"
            exit 1
          fi

          FINAL_NAME="${{ steps.meta.outputs.app_name }}-v${{ steps.meta.outputs.version }}.apk"
          mv "$APK_PATH" "$APK_DIR/$FINAL_NAME"
          echo "apk_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: src/android/app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "${{ needs.build.outputs.app_name }} ${{ needs.build.outputs.tag }}"
          files: ./apk/${{ needs.build.outputs.apk_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
