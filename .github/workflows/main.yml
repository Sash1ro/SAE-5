name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version personnalisée (ex: 1.2.0) — laisser vide pour lire app.json'
        required: false
        type: string
      prerelease:
        description: 'Marquer comme pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      apk_name: ${{ steps.rename.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Extract app name & version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CONFIG_JSON=$(npx expo config --type public --json)

          APP_NAME=$(echo "$CONFIG_JSON" | node -e "
            const c = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const raw = c.slug || c.name || 'app';
            console.log(raw.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, ''));
          ")

          CONFIG_VERSION=$(echo "$CONFIG_JSON" | node -e "
            const c = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(c.version || '1.0.0');
          ")

          TRIMMED_INPUT=$(echo "$INPUT_VERSION" | xargs)
          CLEAN_INPUT="${TRIMMED_INPUT#v}"
          VERSION="${CLEAN_INPUT:-$CONFIG_VERSION}"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        id: rename
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Erreur : aucun APK trouvé dans $APK_DIR"
            exit 1
          fi

          FINAL_NAME="${{ steps.meta.outputs.app_name }}-v${{ steps.meta.outputs.version }}.apk"
          mv "$APK_PATH" "$APK_DIR/$FINAL_NAME"
          echo "apk_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: src/android/app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "${{ needs.build.outputs.app_name }} ${{ needs.build.outputs.tag }}"
          files: ./apk/${{ needs.build.outputs.apk_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
