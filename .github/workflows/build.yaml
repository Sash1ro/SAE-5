name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version (e.g. 1.0.0) — leave blank to use app.json version'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      tag: ${{ steps.meta.outputs.tag }}
      apk_name: ${{ steps.meta.outputs.apk_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Extract app name & version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node << 'JS'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo || {};
          const name = (app.slug || app.name || 'app').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
          let version = (process.env.INPUT_VERSION || '').trim().replace(/^v/, '');
          if (!version && process.env.GITHUB_REF_TYPE === 'tag') version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (!version) version = app.version || '1.0.0';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `app_name=${name}\ntag=v${version}\napk_name=${name}-v${version}.apk\n`);
          JS

      - run: npx expo prebuild --platform android --no-install --clean

      # Gradle 9 breaks ':expo' configuration (components["release"] removed).
      # Gradle 8.14.x works with current Expo/RN templates and needs no patches.
      - name: Use Gradle 8.14.3
        run: |
          sed -i 's#gradle-[0-9.]*-\(bin\|all\)\.zip#gradle-8.14.3-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      # Prints node's real error if autolinking is broken (Gradle hides it).
      - name: Check Expo autolinking
        working-directory: src/android
        run: npx expo-modules-autolinking react-native-config --json --platform android > /dev/null

      - run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: src/android

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          [ -n "$APK" ] || { echo "::error::No APK found"; exit 1; }
          cp "$APK" "android/app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: src/android/app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "${{ needs.build.outputs.app_name }} ${{ needs.build.outputs.tag }}"
          files: ./apk/${{ needs.build.outputs.apk_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}