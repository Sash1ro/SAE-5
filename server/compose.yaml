services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: manga_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - torch_cache:/root/.cache/torch
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: manga_scheduler
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./storage:/app/storage
      - torch_cache:/root/.cache/torch
    command: python docker/cron_runner.py
    depends_on:
      - api

volumes:
  torch_cache:
